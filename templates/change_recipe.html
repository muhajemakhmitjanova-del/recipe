{% extends 'base.html' %}

{% block content %}

<a href="{% url 'recipe_detail' object.pk %}" class="back-btn">« Назад к рецепту</a>

<h2>Редактировать рецепт: {{ object.name }}</h2>

<form method="post" enctype="multipart/form-data" class="recipe-form">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn-submit">Сохранить</button>
</form>



{% include 'components/footer.html' %}
{% endblock %}
